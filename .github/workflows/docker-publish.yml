name: Docker Publish

on:
  push:
    branches:
      - feature/complete-series-pack-support

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/starlightdaemon/sonarr-private
  BRANCH_TAG: feature-complete-series-pack-support

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Honours the SDK pinned in global.json (10.0.301) automatically.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Corepack (bundled with Node 20) activates the yarn version pinned in
      # package.json (yarn@1.22.22); npm is a fallback if corepack is absent.
      - name: Enable Yarn
        run: |
          corepack enable || npm install -g yarn
          yarn --version

      # The frontend builds from the repository root (there is no
      # frontend/package.json); webpack emits the compiled UI to _output/UI.
      - name: Build frontend
        run: |
          yarn install
          yarn build --env production

      - name: Build and publish backend
        run: dotnet msbuild -restore src/Sonarr.sln -p:SelfContained=true -p:Configuration=Release -p:Platform=Posix -p:RuntimeIdentifiers=linux-x64 -p:EnableWindowsTargeting=true -t:PublishAllRids

      # PublishAllRids emits the self-contained backend (including dynamically
      # loaded assemblies such as Sonarr.Mono.dll) to
      # _output/net10.0/linux-x64/publish. Stage that output plus the compiled
      # web UI (emitted to _output/UI by the frontend build) under ./publish so
      # the Dockerfile COPY picks everything up in one pass.
      - name: Stage artifact
        run: |
          mkdir -p ./publish
          cp -r _output/net10.0/linux-x64/publish/* ./publish/
          rm -f ./publish/Sonarr.Windows.*
          rm -f ./publish/ServiceInstall.*
          rm -f ./publish/ServiceUninstall.*
          cp -r _output/UI ./publish/UI

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build image
        run: >-
          docker build
          --file distribution/docker-runtime/Dockerfile
          --tag ${{ env.IMAGE }}:latest
          --tag ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
          .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
