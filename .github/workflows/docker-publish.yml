name: Docker Publish

on:
  push:
    branches:
      - feature/complete-series-pack-support

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/starlightdaemon/sonarr-private
  BRANCH_TAG: feature-complete-series-pack-support

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Honours the SDK pinned in global.json (10.0.301) automatically.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Corepack (bundled with Node 20) activates the yarn version pinned in
      # package.json (yarn@1.22.22); npm is a fallback if corepack is absent.
      - name: Enable Yarn
        run: |
          corepack enable || npm install -g yarn
          yarn --version

      # The frontend builds from the repository root (there is no
      # frontend/package.json); webpack emits the compiled UI to _output/UI.
      - name: Build frontend
        run: |
          yarn install
          yarn build --env production

      # AssemblyName resolves to "Sonarr" for the linux-x64 runtime, so this
      # produces ./publish/Sonarr.dll.
      - name: Publish backend
        run: >-
          dotnet publish src/NzbDrone.Console/Sonarr.Console.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output ./publish

      # Sonarr serves the web UI from ./UI relative to the binary, so the
      # compiled UI must be staged alongside the published backend.
      - name: Stage web UI into publish output
        run: cp -r _output/UI ./publish/UI

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build image
        run: >-
          docker build
          --file distribution/docker-runtime/Dockerfile
          --tag ${{ env.IMAGE }}:latest
          --tag ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
          .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
